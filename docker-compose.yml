# Local development infrastructure: PostgreSQL + MinIO (S3-compatible).
# The Go API and Vite dev server run on the host:
#   docker compose up -d
#   cd backend && go run ./cmd/api --migrate-up && go run ./cmd/api
#   cd frontend && npm run dev
services:
  postgres:
    image: postgres:18-alpine
    container_name: ojt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ojt_management}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ stores data in a subdirectory under /var/lib/postgresql
      - ojt_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ojt_management}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # bitnamilegacy/minio is the community image used here because
    # docker.io/minio/minio requires registry auth in this environment.
    # Any S3-compatible store works; only the endpoint/credentials matter.
    image: bitnamilegacy/minio:latest
    container_name: ojt_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-ojt-evidence}
    command: server /bitnami/minio/data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - ojt_miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ojt_pgdata:
  ojt_miniodata:
